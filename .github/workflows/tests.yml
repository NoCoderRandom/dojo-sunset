name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglu1-mesa
      - name: Install Dojo Sunset
        run: python -m pip install -e .
      - name: Run tests
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a python -m unittest discover -s tests -v
